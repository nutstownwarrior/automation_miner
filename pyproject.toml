[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-miner"
version = "0.2.1"
description = "Home Assistant add-on that mines history for explainable automation suggestions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
package-dir = { "" = "automation_miner" }

[tool.setuptools.packages.find]
where = ["automation_miner"]
include = ["amminer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["automation_miner"]
addopts = "-q --strict-markers"
filterwarnings = [
  # Not a blanket ignore.  This project cares a great deal about which wheels
  # exist for musllinux, so an upstream deprecation is the early warning that a
  # pinned dependency is about to move under it - silencing every one of them
  # removes exactly the signal worth having.  Add a narrow entry per known,
  # accepted warning instead.
  "default::DeprecationWarning",
  "default::UserWarning",
  # mlxtend divides by a zero denominator computing a metric we do not use.
  "ignore:invalid value encountered in divide:RuntimeWarning:mlxtend.*",
]
markers = [
  "mariadb: needs a live MariaDB/MySQL server (set AMMINER_TEST_MYSQL_URL)",
  "slow: takes more than a couple of seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]
