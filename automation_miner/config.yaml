---
name: Automation Miner
version: "0.8.0"
slug: automation_miner
description: >-
  Mines your Home Assistant history for genuinely useful, explainable automation
  suggestions - backtested, conflict-checked and (optionally) turned into
  validated automation YAML by a local LLM.
url: https://github.com/nutstownwarrior/automation_miner
arch:
  - amd64
  - aarch64
init: false
stage: experimental
ingress: true
panel_icon: mdi:pickaxe
panel_title: Automation Miner
# No hassio_api: nothing here calls a Supervisor endpoint.  The Core API is
# reached through the Supervisor proxy, which homeassistant_api alone grants.
homeassistant_api: true
map:
  - homeassistant_config:ro
  - addon_config:rw
  - share:rw
options:
  log_level: info
  schedule: "0 3 * * *"
  run_on_start: true
  analysis_window_days: 0
  max_auto_window_days: 60
  min_consistency: 0.6
  min_occurrences: 5
  time_cluster_minutes: 30
  min_support: 0.02
  min_confidence: 0.6
  min_lift: 1.5
  override_window_seconds: 120
  backtest_min_precision: 0.7
  backtest_min_recall: 0.25
  backtest_min_true_fires: 4
  backtest_max_false_fires_per_week: 3
  backtest_max_nuisance_fires: 0
  backtest_holdout_fraction: 0.25
  backtest_min_holdout_days: 7
  backtest_min_train_days: 14
  health_min_days: 7
  health_min_predicted_for_dormant: 3
  health_noisy_override_rate: 0.3
  health_overridden_override_rate: 0.6
  health_min_fires_for_verdict: 5
  health_shortfall_ratio: 0.3
  allow_security_actions: false
  notify_on_new_suggestions: true
  notify_service: ""
  excluded_domains: []
  excluded_entities: []
  excluded_users: []
  llm_provider: none
  llm_model: ""
  llm_base_url: ""
  llm_api_key: ""
  llm_entity_classification: false
  llm_hypotheses: false
  llm_triage: false
  llm_audit: false
  llm_gaps: false
  llm_preferences: false
  llm_explain: false
  llm_scenes: false
  llm_areas: false
  llm_home_mode_labels: false
  home_mode_enabled: true
  ranking_enabled: true
  ranking_prior_strength: 30.0
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  schedule: str?
  run_on_start: bool?
  analysis_window_days: int(0,3650)?
  max_auto_window_days: int(1,3650)?
  min_consistency: float(0.0,1.0)?
  min_occurrences: int(2,1000)?
  time_cluster_minutes: int(1,240)?
  min_support: float(0.0,1.0)?
  min_confidence: float(0.0,1.0)?
  min_lift: float(0.0,1000.0)?
  override_window_seconds: int(1,3600)?
  backtest_min_precision: float(0.0,1.0)?
  backtest_min_recall: float(0.0,1.0)?
  backtest_min_true_fires: int(1,1000)?
  backtest_max_false_fires_per_week: float(0.0,1000.0)?
  backtest_max_nuisance_fires: int(0,1000)?
  backtest_holdout_fraction: float(0.0,0.9)?
  backtest_min_holdout_days: int(1,3650)?
  backtest_min_train_days: int(1,3650)?
  health_min_days: int(1,3650)?
  health_min_predicted_for_dormant: int(1,1000)?
  health_noisy_override_rate: float(0.0,1.0)?
  health_overridden_override_rate: float(0.0,1.0)?
  health_min_fires_for_verdict: int(1,1000)?
  health_shortfall_ratio: float(0.0,1.0)?
  allow_security_actions: bool?
  notify_on_new_suggestions: bool?
  notify_service: str?
  excluded_domains:
    - str?
  excluded_entities:
    - str?
  excluded_users:
    - str?
  llm_provider: list(none|ollama|openai|anthropic|google|openrouter)?
  llm_model: str?
  llm_base_url: str?
  llm_api_key: password?
  llm_entity_classification: bool?
  llm_hypotheses: bool?
  llm_triage: bool?
  llm_audit: bool?
  llm_gaps: bool?
  llm_preferences: bool?
  llm_explain: bool?
  llm_scenes: bool?
  llm_areas: bool?
  llm_home_mode_labels: bool?
  llm_classification_batch: int(5,200)?
  llm_hypothesis_candidates: int(0,100)?
  llm_hypotheses_per_candidate: int(0,10)?
  llm_triage_penalty: float(0.0,1.0)?
  home_mode_enabled: bool?
  ranking_enabled: bool?
  ranking_prior_strength: float(0.01,1000.0)?
