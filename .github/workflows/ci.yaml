---
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation_miner/requirements.txt
          pip install --no-deps -r automation_miner/requirements-nodeps.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest --cov=amminer --cov-report=term-missing --cov-fail-under=85

  test-mariadb:
    name: Recorder SQL against MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: homeassistant
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation_miner/requirements.txt
          pip install --no-deps -r automation_miner/requirements-nodeps.txt
          pip install pytest
      - name: Run the dialect tests
        env:
          AMMINER_TEST_MYSQL_URL: mysql+pymysql://root:root@127.0.0.1:3306/homeassistant
        run: pytest -m mariadb --no-header

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check automation_miner/amminer tests

  wheels:
    name: Image deps resolve to wheels (musl ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every pinned dependency must have a musllinux wheel
        # The image has no compiler, so a dependency without a musl wheel for
        # the interpreter build.yaml pins breaks the image build. Catch it here
        # rather than in the much slower build job.
        #
        # PYTHON_VERSION must match build.yaml's base-python tag;
        # test_config_and_addon.py asserts that they agree.
        env:
          PYTHON_VERSION: "3.13"
        run: |
          abi="cp${PYTHON_VERSION/./}"
          pip download --only-binary=:all: \
            --platform musllinux_1_1_${{ matrix.arch }} \
            --platform musllinux_1_2_${{ matrix.arch }} \
            --python-version "${PYTHON_VERSION}" --implementation cp --abi "${abi}" \
            -d /tmp/wheels -r automation_miner/requirements.txt
          pip download --only-binary=:all: --no-deps \
            -d /tmp/wheels -r automation_miner/requirements-nodeps.txt

  addon-lint:
    name: Add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./automation_miner"

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [test, lint, wheels, addon-lint, test-mariadb]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build the add-on image
        uses: home-assistant/builder@master
        with:
          # config.yaml deliberately has no `image:` key, so the Supervisor
          # builds the add-on locally on the user's device instead of pulling a
          # published image. The builder takes the image name from that key, so
          # a test build has to be given one explicitly or it produces an empty
          # tag. --test builds without pushing anywhere.
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/automation_miner \
            --image {arch}-addon-automation-miner \
            --docker-hub ghcr.io/${{ github.repository_owner }}
